name: PR Build Check

# 只编译检查，不发布、不往 main 推 APK
on:
  pull_request:
    branches: [ main ]

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: npm test

      - name: Set up Python (剧场立绘要用 Pillow 压图)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache theater art
        uses: actions/cache@v4
        with:
          path: .art-cache
          key: art-${{ hashFiles('art/sources.json') }}

      # 剧场立绘（わたおきば的免费素材）：素材不准转发原图、仓库又是公开的，所以不进仓库，打包时按 art/sources.json 现下，只进 APK
      - name: Fetch theater art
        run: |
          pip install --quiet pillow
          python3 scripts/build-art.py --fetch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Cache on-device ASR files
        uses: actions/cache@v4
        with:
          path: .asr-cache
          key: asr-sherpa-1.13.8-libs-vad

      - name: Fetch on-device ASR (sherpa-onnx libs + model)
        run: bash scripts/fetch-asr.sh

      - name: Check LLM secret (不输出内容)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning title=LLM_API_KEY::没有设置，APK 里不会带 key"
          else
            lines=$(printf '%s\n' "$LLM_API_KEY" | grep -c .)
            first=$(printf '%s\n' "$LLM_API_KEY" | grep -m1 . | tr -d '[:space:]')
            echo "::notice title=LLM_API_KEY::非空行数=${lines}，第一行长度=${#first}"
          fi

      - name: Build Debug APK
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ASR_API_KEY: ${{ secrets.QWEN_API || secrets.ASR_API_KEY }}   # 千问 AI 平台的 key（sk-ws-）优先
          ASR_BASE_URL: ${{ vars.ASR_BASE_URL }}
          ASR_MODEL: ${{ vars.ASR_MODEL }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.10.2; fi
          chmod +x ./gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; then
            # 把失败原因作为注解输出，方便在 PR 页面直接看到
            msg=$(grep -E -A15 "What went wrong|^e: |error:" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-PR-${{ github.event.pull_request.number }}-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
