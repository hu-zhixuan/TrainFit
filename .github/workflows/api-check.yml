name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Call LLM exactly like the app does
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          SPLIT="原话：早上+晚上,无标点：早+晚"
          PARSER=old ONLY="$SPLIT" ROUNDS=4 node .github/api_check.js
          PARSER=new ONLY="$SPLIT" ROUNDS=4 node .github/api_check.js
          PARSER=new SKIP="$SPLIT" node .github/api_check.js
