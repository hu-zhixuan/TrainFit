name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: 只列出 Secrets / Variables 的名字（不打印值）
        env:
          S: ${{ toJSON(secrets) }}
          V: ${{ toJSON(vars) }}
        run: |
          node -e '
            const s = JSON.parse(process.env.S || "{}"), v = JSON.parse(process.env.V || "{}");
            const len = (x) => String(x || "").trim().length;
            console.log("::notice title=Secrets 名字::" + Object.keys(s).map(k => k + "（长度 " + len(s[k]) + "）").join("、"));
            console.log("::notice title=Variables 名字::" + (Object.keys(v).join("、") || "无"));
          '
