name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  atria:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: v4.7 问以前的事 ×4（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TAG: 新
        run: ONLY="上周练了几次,哪天吃得最多,体重变化" ROUNDS=4 node .github/api_past.js \&\& ONLY="蛋白够不够（带两周）,记录不受影响" ROUNDS=2 node .github/api_past.js
