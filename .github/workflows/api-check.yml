name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 千问 key 现在能用哪些模型
        env:
          K: ${{ secrets.QWEN_API }}
        run: node .github/qw_probe.js
