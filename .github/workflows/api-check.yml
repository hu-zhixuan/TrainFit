name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare SiliconFlow ASR models
        env:
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_BASE_URL: ${{ vars.ASR_BASE_URL }}
        run: |
          node .github/asr_cloud_check.js
