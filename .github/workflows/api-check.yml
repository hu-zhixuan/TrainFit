name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  atria:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: v5.4 例子的括号：A 现在 / B add 后面跟 dayOffset，带计划的 5 句 ×3（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          GAP=15000 VARIANT=A node .github/json_v54.js > a.log 2>&1 &
          sleep 7
          GAP=15000 VARIANT=B node .github/json_v54.js > b.log 2>&1 &
          wait
          cat a.log b.log
