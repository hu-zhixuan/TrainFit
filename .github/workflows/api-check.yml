name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  atria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 关键用例 ×4（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TAG: 关键
        run: ONLY="小本本：名字和忌口,小本本：变了要划掉,描述器械：坐着往前推,描述器械：拉下来的" ROUNDS=4 node .github/api_v43.js
      - name: 其他 ×2（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TAG: 其他
        run: SKIP="小本本：名字和忌口,小本本：变了要划掉,描述器械：坐着往前推,描述器械：拉下来的" ROUNDS=2 node .github/api_v43.js
