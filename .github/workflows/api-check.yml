name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  ws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 千问实时识别 WebSocket（只用免费的 qwen-audio-3.1-asr-flash-message）
        env:
          K: ${{ secrets.QWEN_API }}
        run: |
          npm i --no-save ws@8 >/dev/null 2>&1
          node .github/ws_probe.js
