name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 本机模型镜像
        run: bash .github/mirror_probe.sh
  atria-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Atria 联网搜索
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: node .github/atria_search_probe.js
