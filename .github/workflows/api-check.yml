name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  atria:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: v5.5 没点按钮也提醒一句：改计划 / 改记录别带偏（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          GAP=15000 node .github/api_v55.js
