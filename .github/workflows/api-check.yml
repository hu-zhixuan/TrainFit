name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  atria:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: v5.4 最终版：带计划 5 句 ×3、回归 44 句 | 计划 / 挪日期 / 份量 / 小本本 / 练腿 / 接着问 / 体重 / 速度（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          (GAP=15000 VARIANT=最终 node .github/json_v54.js; GAP=15000 node .github/api_check.js) > p1.log 2>&1 &
          sleep 7
          (for f in api_plan api_move api_portion api_v45 api_v43 api_v48 api_v54 speed_cmp; do echo "=== $f"; GAP=15000 node .github/$f.js || true; done) > p2.log 2>&1 &
          wait
          cat p1.log p2.log
