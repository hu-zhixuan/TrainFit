name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  atria:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: v5.4 新旧提示词比速度（12 句记录，流式）+ 改计划 ×3（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          (GAP=15000 TAG=新 node .github/speed_cmp.js; GAP=15000 TAG=新 ROUNDS=3 node .github/api_plan.js) > new.log 2>&1 &
          sleep 7
          (GAP=15000 PARSER=old TAG=旧 node .github/speed_cmp.js; GAP=15000 PARSER=old TAG=旧 ROUNDS=3 node .github/api_plan.js) > old.log 2>&1 &
          wait
          cat new.log old.log
      - name: v5.4 复测：昨晚、口喷、补充、无关、又记又问 ×3，体重 / 按分钟 / 没说重量 ×2，挪日期，照顾小本本 ×3（新提示词，只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          GAP=15000 ROUNDS=3 ONLY="昨晚,口喷：记+练+删+问,补充：火锅是牛油的,问：无关,问：又记又问" node .github/api_check.js || true
          GAP=15000 ROUNDS=2 node .github/api_v54.js || true
          GAP=15000 node .github/api_move.js || true
          GAP=15000 ROUNDS=2 ONLY="真的无关（还是帮不上）" node .github/api_v45.js || true
          GAP=15000 ROUNDS=3 ONLY="照顾小本本：不吃辣" node .github/api_v43.js || true
