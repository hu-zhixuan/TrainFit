name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  atria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 新：份量选项 ×4（只用 Atria）
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TAG: 新
        run: ROUNDS=4 node .github/api_portion.js
      - name: 旧（main）：同样两句 ×4，比耗时
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PARSER: old
        run: ONLY="一瓶甜牛奶（该问）,烧烤（截图那句）" ROUNDS=4 node .github/api_portion.js
