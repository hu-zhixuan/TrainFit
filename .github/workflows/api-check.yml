name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare cloud ASR (千问 sk-ws- key 自动测 qwen3-asr-flash)
        env:
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_BASE_URL: ${{ vars.ASR_BASE_URL }}
        run: |
          case "$(printf %s "$ASR_API_KEY" | head -c 6)" in
            sk-ws-) node .github/asr_cloud_check.js && NO_CONTEXT=1 node .github/asr_cloud_check.js ;;
            *) echo "::notice title=ASR key::还不是千问的 key（sk-ws- 开头），先不测" ;;
          esac
