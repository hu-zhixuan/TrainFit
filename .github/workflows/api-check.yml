name: API Check (temporary)
on:
  push:
    branches: [ claude/api-check ]
jobs:
  where:
    runs-on: ubuntu-latest
    steps:
      - name: 千问的 key 放在哪了（只看长度和开头，不打印）
        env:
          A: ${{ secrets.QWENAPI }}
          B: ${{ vars.QWENAPI }}
          C: ${{ secrets.QWEN_API }}
          D: ${{ secrets.QWEN_API_KEY }}
          E: ${{ secrets.DASHSCOPE_API_KEY }}
          F: ${{ secrets.ASR_API_KEY }}
          G: ${{ vars.QWEN_API }}
          H: ${{ vars.QWEN_API_KEY }}
        run: |
          out=""
          for n in A B C D E F G H; do
            v=$(printf %s "${!n}" | tr -d '[:space:]')
            p=$(printf %s "$v" | head -c 6); case "$p" in sk-ws-) t="sk-ws-";; sk-*) t="sk-";; "") t="空";; *) t="其他";; esac
            out="$out $n=${#v}/$t"
          done
          echo "::notice title=key 在哪::A secrets.QWENAPI B vars.QWENAPI C secrets.QWEN_API D secrets.QWEN_API_KEY E secrets.DASHSCOPE_API_KEY F secrets.ASR_API_KEY G vars.QWEN_API H vars.QWEN_API_KEY →$out"
