name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Locate and Rename APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/TrainFit-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.0-APK
          path: release-apk/TrainFit-v1.0.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "TrainFit v1.0.0 (练食AI 官方安装包)"
          body: |
            ## 🏋️‍♂️ 练食AI (TrainFit) v1.0.0 官方独立 APK 安装包
            
            ### 📱 安装说明：
            1. 点击下方 **Assets** 中的 `TrainFit-v1.0.apk` 直接下载到手机；
            2. 在安卓手机上点击安装包安装即可直接使用；
            3. **零依赖**：无需配置 API Key，内置全量离线中式饮食热量数据库、中文语音解析引擎与超负荷加片建议算法。
          files: release-apk/TrainFit-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
