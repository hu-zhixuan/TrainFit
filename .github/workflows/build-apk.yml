name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/TrainFit-v1.5.apk
          cp "$APK_PATH" release-apk/TrainFit-Latest.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.5-APK
          path: release-apk/TrainFit-v1.5.apk
          retention-days: 30

      - name: Commit and Push APK directly to repo
        run: |
          mkdir -p downloads
          cp release-apk/TrainFit-v1.5.apk downloads/TrainFit-v1.5.apk
          cp release-apk/TrainFit-v1.5.apk downloads/TrainFit-Latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TrainFit-v1.5.apk downloads/TrainFit-Latest.apk
          git commit -m "chore(release): upload pre-built TrainFit-v1.5.apk binary [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.5
          name: "TrainFit v1.5 多巴胺视效与后台音频稳定性重磅升级版 (Android APK)"
          body: |
            ### 🏋️‍♂️ 练食AI (TrainFit) v1.5 核心升级

            - 🛡️ **麦克风音频焦点智能隔离（Audio Focus Isolation）**：
              - 彻底解决启动 App 时抢占音频焦点导致后台音乐（网易云/QQ音乐/Spotify）被打断的问题；
              - 仅在用户显式录音时调起麦克风，录音结束或切出后台瞬间自动释放硬件音频流通道，边听歌边举铁无缝进行。
            - ⚡ **Android 后台挂起防黑屏与生命周期崩溃自愈（Lifecycle & GPU Crash Recovery）**：
              - 深度适配 Activity `onPause` / `onResume` 生命周期与 WebView 定时器休眠唤醒；
              - 内置 `onRenderProcessGone` 崩溃自愈保护，后台长时间挂起再切回秒级恢复，彻底告别卡退与黑屏。
            - 🎉 **全景多巴胺礼花动效引擎（ConfettiEngine）**：
              - 零依赖 60 FPS Canvas 礼花引擎，当 To-Do 清单整组训练动作全部完成或触发超负荷突破时，激发全屏绚丽五彩粒子礼花庆祝！
            - 🎯 **动态肌群发光微标（Dynamic Muscle Badges）**：
              - 为各个训练动作注入专属发光微标：胸大肌 🎯、背阔肌 🦅、臀腿下肢 🦵、三角肩部 🛡️、手臂肱肌 ⚡、核心 💎。
            - 🏆 **金色超负荷突破奖杯徽章（Overload Trophy Badge）**：
              - 满足超负荷加载门槛时，动作卡片自动点亮金色奖杯发光徽章，高亮提示下次目标加片重量。
            - 🏋️‍♂️ **3D 拟真奥运标准彩色杠铃片可视化（Barbell Plate Visualizer）**：
              - 配备红 25kg、蓝 20kg、黄 15kg、绿 10kg、白 5kg、黑 2.5kg、银 1.25kg 标准奥运色彩与滑入落锁动效。
            - 📳 **触觉振动反馈（HapticEngine）**：
              - 针对轻触、完成单项打卡、达成整组 PR 分别调校了细腻干脆的触感振动节律。
            - ☀️ **瑞士纯净「白天模式」与「黑夜极简」全景双色阶自适应**。
            - 📋 **循环训练 To-Do 待办清单与口播序列自动生成 Card**。
            - 🎙️ **全能中式口喷与多轮智能要素补全助手**。

            **📥 直接点击下方 Assets 中的 `TrainFit-v1.5.apk` 或 `TrainFit-Latest.apk` 即可下载安装。**
          draft: false
          prerelease: false
          files: |
            release-apk/TrainFit-v1.5.apk
            release-apk/TrainFit-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
