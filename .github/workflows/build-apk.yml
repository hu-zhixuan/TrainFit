name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        env:
          # 一键记录用的大模型接口：在仓库 Settings → Secrets and variables → Actions 里配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Read app version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "release-apk/TrainFit-v${VERSION}.apk"
          cp "$APK_PATH" release-apk/TrainFit-Latest.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v${{ env.VERSION }}-APK
          path: release-apk/TrainFit-v${{ env.VERSION }}.apk
          retention-days: 30

      - name: Commit and Push APK directly to repo
        run: |
          mkdir -p downloads
          cp "release-apk/TrainFit-v${VERSION}.apk" "downloads/TrainFit-v${VERSION}.apk"
          cp "release-apk/TrainFit-v${VERSION}.apk" downloads/TrainFit-Latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "downloads/TrainFit-v${VERSION}.apk" downloads/TrainFit-Latest.apk
          git commit -m "chore(release): upload pre-built TrainFit-v${VERSION}.apk binary [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ env.VERSION }}
          name: "TrainFit v${{ env.VERSION }} 懒人一键记录版 (Android APK)"
          body: |
            ### 🎙️ 练食AI (TrainFit) v1.6：一口气说完，自动记好

            - **懒人一键记录**：按住底部绿色按钮，把今天练了什么、吃了什么一口气说完，松手自动拆成训练和饮食记录并保存，不满意点「撤销」。点一下按钮也可以打字。
            - **真正的 AI 解析**：接入大模型（OpenAI 兼容接口），自动识别动作、重量、组数、次数、有氧时长，估算饮食热量和三大营养素；没说的重量和组数按上次记录补。
            - **语音终于能用了**：改用手机系统语音识别（之前 App 里的语音一直识别不出字）。手机没有系统语音服务时自动改成打字，输入法语音键同样可用。
            - **说「昨天」记到昨天**，有氧按时长显示。
            - **修复**：北京时间凌晨 0–8 点的记录被算到前一天；翻日期一次跳两天。
            - **更快**：去掉每次解析前白等几秒的无效请求。
            - 「身体档案 → AI 接口」可以自行更换接口地址、模型和 key，并测试连接。

            **📥 下载下方 Assets 中的 `TrainFit-v${{ env.VERSION }}.apk` 或 `TrainFit-Latest.apk` 安装即可。**
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apk/TrainFit-v${{ env.VERSION }}.apk
            release-apk/TrainFit-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
