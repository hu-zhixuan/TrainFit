name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Cache on-device ASR files
        uses: actions/cache@v4
        with:
          path: .asr-cache
          key: asr-sherpa-1.13.8-paraformer-zh-small-2024-03-09

      - name: Fetch on-device ASR (sherpa-onnx libs + model)
        run: bash scripts/fetch-asr.sh

      - name: Build Android Debug APK
        env:
          # 一键记录用的大模型接口：在仓库 Settings → Secrets and variables → Actions 里配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_BASE_URL: ${{ vars.ASR_BASE_URL }}
          ASR_MODEL: ${{ vars.ASR_MODEL }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Read app version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "release-apk/TrainFit-v${VERSION}.apk"
          cp "$APK_PATH" release-apk/TrainFit-Latest.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v${{ env.VERSION }}-APK
          path: release-apk/TrainFit-v${{ env.VERSION }}.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ env.VERSION }}
          name: "TrainFit v${{ env.VERSION }} 不健身也能用 + 说一句记体重 (Android APK)"
          body: |
            ### 🥢 练食AI (TrainFit) v2.3：说一句话，帮你记下今天吃了啥

            - **不只给健身的人用**：第一次打开先问你想用它做什么——想瘦一点 / 就记记吃了啥 / 在健身（减脂、增肌）。选前两种，首页只剩「今天吃了多少、还能吃多少」和体重，训练、蛋白质、热量缺口这些词都藏起来。设置里随时可以切换。
            - **说一句就记体重**：「体重 62.5」「今天称了 124 斤」都行，斤会自动换算；只报体重时不用等 AI，立刻记好。也可以和吃的一起说：「中午黄焖鸡，体重 61.5」。
            - **首页体重一行**：显示今天体重、比一周前轻了还是重了，点一下能改。最新体重会自动用来算每天消耗。
            - **趋势页**：「只记吃的」模式下显示每天吃了多少和超预算天数；两种模式都多了体重曲线。
            - 已经在用的老用户不会看到引导，界面和以前一样。

            **📥 下载下方 Assets 中的 `TrainFit-v${{ env.VERSION }}.apk` 或 `TrainFit-Latest.apk`，覆盖安装即可，数据保留。**
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apk/TrainFit-v${{ env.VERSION }}.apk
            release-apk/TrainFit-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
