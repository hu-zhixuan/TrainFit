name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/TrainFit-v1.1.2.apk
          cp "$APK_PATH" release-apk/TrainFit-Latest.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.1.2-APK
          path: release-apk/TrainFit-v1.1.2.apk
          retention-days: 30

      - name: Commit and Push APK directly to repo
        run: |
          mkdir -p downloads
          cp release-apk/TrainFit-v1.1.2.apk downloads/TrainFit-v1.1.2.apk
          cp release-apk/TrainFit-v1.1.2.apk downloads/TrainFit-Latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TrainFit-v1.1.2.apk downloads/TrainFit-Latest.apk
          git commit -m "chore(release): upload pre-built TrainFit-v1.1.2.apk binary [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.1.2
          name: "TrainFit v1.1.2 AI 智能升级版 (Android APK)"
          body: |
            ### 🏋️‍♂️ 练食AI (TrainFit) v1.1.2 重磅更新

            - 🎙️ **多轮语音要素补全助手（Multi-turn Factor Completion）**：自动校验动作、重量、组数、次数4大核心要素；要素不全时无缝唤起交互式追问气泡，支持语音/快捷胶囊/键盘多模态补全并严格阻断缺失保存；
            - 📋 **循环训练 To-Do 待办清单（Cyclical Routine To-Do List）**：支持用户自定义创建、保存、重命名专属训练计划卡片，结合高频历史智能推荐，支持单项打钩划线置灰（0.5透明度）及一键重新激活开启新一轮循环；
            - 🧠 **上下文自适应偏置与健身同音词模糊纠偏（Additive Contextual & Phonetic Fuzzy AI）**：引入高星开源语音规范化与编辑距离容错架构，口喷优先偏置绑定活跃 To-Do 清单动作，自动纠偏“卧腿/卧推”、“四组八哥/4组8个”、“划川/划船”等口语化识别瑕疵；
            - 🏋️‍♂️ **杠铃片智能配重算片器与 Epley 1RM 极限力量预估**：自动扣除 20kg 奥林匹克标准杆，智能贪心匹配彩色杠铃片装片图解，达标自动点亮超负荷加片建议；
            - 🎯 **四大经典宏量预设与碳蛋脂热量缺口动态闭环**；
            - 🥢 **800+ 临床级中餐营养数据库与 9 大烹饪吸油率矩阵**；
            - 📱 **AndroidX Webkit 高性能离线架构**：安装包仅 2.3MB，冷启动毫秒级秒开，与电脑端体验 100% 像素级一致。

            **📥 直接点击下方 Assets 中的 `TrainFit-v1.1.2.apk` 或 `TrainFit-Latest.apk` 即可下载安装。**
          draft: false
          prerelease: false
          files: |
            release-apk/TrainFit-v1.1.2.apk
            release-apk/TrainFit-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
