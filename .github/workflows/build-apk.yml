name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/TrainFit-v1.4.apk
          cp "$APK_PATH" release-apk/TrainFit-Latest.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.4-APK
          path: release-apk/TrainFit-v1.4.apk
          retention-days: 30

      - name: Commit and Push APK directly to repo
        run: |
          mkdir -p downloads
          cp release-apk/TrainFit-v1.4.apk downloads/TrainFit-v1.4.apk
          cp release-apk/TrainFit-v1.4.apk downloads/TrainFit-Latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TrainFit-v1.4.apk downloads/TrainFit-Latest.apk
          git commit -m "chore(release): upload pre-built TrainFit-v1.4.apk binary [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.4
          name: "TrainFit v1.4 AI 智能重磅版 (Android APK)"
          body: |
            ### 🏋️‍♂️ 练食AI (TrainFit) v1.4 核心升级

            - ✨ **全新「工精微动效系统」（Micro-Animations）**：
              - **To-Do 打钩 Q 弹回弹**：打卡触发物理阻尼弹性回弹微动效，手感干脆利落；
              - **平滑滑动下沉置底**：勾选动作以优雅贝塞尔曲线平滑下沉置底并置灰（0.38透明度），未完成动作保持在上方；
              - **全组完成祝贺流光横幅**：全部完成触发弹跳入场与 4s 粒子呼吸扫光横幅；
              - **计划 Card 呼吸微光晕**：当前激活卡片低频呼吸发光，Hover 悬停微升；
              - **日月模式切换旋转**：点击顶部切换按钮触发 90° 弹性微旋转动效。
            - ☀️ **瑞士纯净「白天模式」全景优化**：
              - 修复英雄卡片暗色遮罩问题，采用冷调哑光纸白底色（#ffffff）搭配发丝微阴影；
              - Canvas 走势图与环形仪表盘全量自适应黑夜/白昼双色阶渲染，阳光下字阶清晰锐利；
              - 模态弹窗与 Toast 全面适配轻盈白昼霜雾毛玻璃风格。
            - 🎙️ **口播动作序列自动生成置顶计划 Card**：口播录入一组动作序列后，系统自动提炼生成置顶的专属计划 Card（如【胸部分化序列 (3动作)】），随时点击选择或重载；
            - 📱 **软键盘与弹窗交互无缝保持**：彻底修复补全参数时输入数字软键盘弹走跳焦问题，支持流畅连续输入任意重量与组数；
            - 🎙️ **弹窗内嵌极速语音补全（Inline Voice Recorder）**：呼吸红点脉冲 + 毫秒级录音计时 + 实时文字流，一键自动槽位增量填入；
            - 🗣️ **多轮语音要素补全助手（Multi-turn Factor Completion）**：自动校验动作、重量、组数、次数4大核心要素，智能追问气泡，快捷 Chip 胶囊一键补全；
            - 🧠 **上下文自适应偏置与健身同音词模糊纠偏（Additive Contextual & Phonetic Fuzzy AI）**；
            - 🏋️‍♂️ **杠铃片智能配重算片器与 Epley 1RM 极限力量预估**：自动扣除 20kg 奥林匹克标准杆，智能贪心匹配彩色杠铃片装片图解，达标自动点亮超负荷加片建议；
            - 🎯 **四大经典宏量预设与碳蛋脂热量缺口动态闭环**；
            - 🥢 **800+ 临床级中餐营养数据库与 9 大烹饪吸油率矩阵**；
            - 📱 **AndroidX Webkit 高性能离线架构**：安装包仅 2.3MB，冷启动毫秒级秒开，与电脑端体验 100% 像素级一致。

            **📥 直接点击下方 Assets 中的 `TrainFit-v1.4.apk` 或 `TrainFit-Latest.apk` 即可下载安装。**
          draft: false
          prerelease: false
          files: |
            release-apk/TrainFit-v1.4.apk
            release-apk/TrainFit-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
