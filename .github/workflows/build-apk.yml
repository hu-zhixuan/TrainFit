name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'   # 只改文档不重新发版
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Cache on-device ASR files
        uses: actions/cache@v4
        with:
          path: .asr-cache
          key: asr-sherpa-1.13.8-sense-voice-int8-2024-07-17

      - name: Fetch on-device ASR (sherpa-onnx libs + model)
        run: bash scripts/fetch-asr.sh

      - name: Build Android Debug APK
        env:
          # 一键记录用的大模型接口：在仓库 Settings → Secrets and variables → Actions 里配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_BASE_URL: ${{ vars.ASR_BASE_URL }}
          ASR_MODEL: ${{ vars.ASR_MODEL }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Read app version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "release-apk/TrainFit-v${VERSION}.apk"
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v${{ env.VERSION }}-APK
          path: release-apk/TrainFit-v${{ env.VERSION }}.apk
          retention-days: 30

      - name: Release notes from CHANGELOG.md
        run: |
          # 取 CHANGELOG.md 里「## v版本号」这一节
          awk -v v="## v${VERSION} " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "CHANGELOG.md 里没有 v${VERSION} 的说明" > release-notes.md; fi
          printf '\n**📥 下载下方 Assets 里的 `TrainFit-v%s.apk`，覆盖安装即可，数据保留。**\n' "$VERSION" >> release-notes.md
          TITLE=$(grep -m1 "^## v${VERSION} " CHANGELOG.md | sed 's/^## v[^ ]* *·* *//')
          echo "RELEASE_TITLE=${TITLE}" >> "$GITHUB_ENV"
          cat release-notes.md

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ env.VERSION }}
          name: "TrainFit v${{ env.VERSION }} ${{ env.RELEASE_TITLE }} (Android APK)"
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apk/TrainFit-v${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 以前每个版本还传一份 TrainFit-Latest.apk，和带版本号的是同一个文件；只留带版本号的
      - name: Remove duplicate TrainFit-Latest.apk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset "v${VERSION}" TrainFit-Latest.apk -y --repo "${{ github.repository }}" || true
