name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          export PATH=$PWD/gradle-8.10.2/bin:$PATH
          gradle assembleDebug -x test --no-daemon --stacktrace

      - name: Collect APK Files
        run: |
          mkdir -p release-apk
          find app/build/outputs/ -name "*.apk" -exec cp {} release-apk/TrainFit-v1.0.apk \;
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.0-APK
          path: release-apk/TrainFit-v1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "TrainFit v1.0.0 (练食AI 官方独立安装包)"
          draft: false
          prerelease: false
          body: |
            ## 🏋️‍♂️ 练食AI (TrainFit) v1.0.0 官方独立 APK 安装包发布

            ### 📱 安装与使用说明：
            1. 点击下方 **Assets** 列表中的 `TrainFit-v1.0.apk` 直接下载到手机；
            2. 在安卓手机上点击安装包直接安装使用；
            3. **100% 离线独立可用**：无需任何 API Key，内置全量中式餐饮热量库、口喷分量自动折算与超负荷加片建议。
          files: release-apk/TrainFit-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
