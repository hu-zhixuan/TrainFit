name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK Files
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apk/TrainFit-v1.0.apk \;
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.0-APK
          path: release-apk/TrainFit-v1.0.apk

      - name: Copy APK to repo downloads
        run: |
          cp release-apk/TrainFit-v1.0.apk downloads/TrainFit-v1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/TrainFit-v1.0.apk
          git diff --cached --quiet || git commit -m "ci: update TrainFit-v1.0.apk with latest build"
          git push origin main
