name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK Files
        run: |
          mkdir -p release-apk
          find . -name "*.apk" -exec cp {} release-apk/TrainFit-v1.0.apk \;
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.0-APK
          path: release-apk/TrainFit-v1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "TrainFit v1.0.0 (练食AI 官方独立安装包)"
          draft: false
          prerelease: false
          body: |
            ## 🏋️‍♂️ 练食AI (TrainFit) v1.0.0 官方独立 APK 安装包

            ### 📱 安装与使用说明：
            1. 点击下方 **Assets** 列表中的 `TrainFit-v1.0.apk` 直接下载到手机；
            2. 点击安装包即可安装使用；
            3. **100% 离线独立可用**：无需任何 API Key，内置全量中式餐饮热量库、口喷分量自动折算与超负荷加片建议。
          files: release-apk/TrainFit-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
