name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        env:
          # 一键记录用的大模型接口：在仓库 Settings → Secrets and variables → Actions 里配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Read app version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "release-apk/TrainFit-v${VERSION}.apk"
          cp "$APK_PATH" release-apk/TrainFit-Latest.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v${{ env.VERSION }}-APK
          path: release-apk/TrainFit-v${{ env.VERSION }}.apk
          retention-days: 30

      - name: Commit and Push APK directly to repo
        run: |
          mkdir -p downloads
          cp "release-apk/TrainFit-v${VERSION}.apk" "downloads/TrainFit-v${VERSION}.apk"
          cp "release-apk/TrainFit-v${VERSION}.apk" downloads/TrainFit-Latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "downloads/TrainFit-v${VERSION}.apk" downloads/TrainFit-Latest.apk
          git commit -m "chore(release): upload pre-built TrainFit-v${VERSION}.apk binary [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ env.VERSION }}
          name: "TrainFit v${{ env.VERSION }} 输入修复 (Android APK)"
          body: |
            ### 🛠 练食AI (TrainFit) v1.7.1：输入框修复

            - **修复输入框打不了字**：之前进入「正在听」后输入框会变成只读，系统语音没反应时就一直卡住；按钮点过后也可能一直变灰。现在输入框任何时候都能打字，按钮任何时候都能点。
            - **点一下底部按钮 = 打字**：直接弹出键盘，可以用输入法键盘上的🎤说话（讯飞、搜狗、微信输入法的中文识别都很好）。
            - **按住底部按钮 = 系统语音**（手机有系统语音识别时）。系统语音 3 秒没反应会自动退回打字，本次不再尝试；没有系统语音的手机，按住也直接打字。
            - 面板里新增「语音」按钮，可以边说边改；说到一半开始打字，会自动停掉语音、保留已识别的内容。
            - 设置里会显示这台手机有没有可用的系统语音识别。

            **📥 下载下方 Assets 中的 `TrainFit-v${{ env.VERSION }}.apk` 或 `TrainFit-Latest.apk`，覆盖安装即可，数据保留。**
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apk/TrainFit-v${{ env.VERSION }}.apk
            release-apk/TrainFit-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
