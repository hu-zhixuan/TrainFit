name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/TrainFit-v1.0.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v1.0-APK
          path: release-apk/TrainFit-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 release-apk/TrainFit-v1.0.apk \
            --title "TrainFit v1.0.0 正式安装包 (Android APK)" \
            --notes "### 🏋️‍♂️ 练食AI (TrainFit) v1.0.0 正式版下载\n\n- 🎙️ **全能中式口喷饮食与训练记录**\n- ⚡ **自动超负荷加片建议 (Progressive Overload)**\n- 🎯 **动态热量缺口与三大营养素闭环**\n- 📴 **纯本地离线运行模式**，无配置开箱即用！\n\n**📥 直接点击下方 Assets 中的 TrainFit-v1.0.apk 即可下载并安装到手机。**" || \
          gh release upload v1.0.0 release-apk/TrainFit-v1.0.apk --clobber

      - name: Update pre-built APK in repo downloads
        run: |
          mkdir -p downloads
          cp release-apk/TrainFit-v1.0.apk downloads/TrainFit-v1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/TrainFit-v1.0.apk
          git diff --cached --quiet || (git commit -m "ci: update pre-built TrainFit-v1.0.apk [skip ci]" && git push origin main)
