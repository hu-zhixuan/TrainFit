name: Build and Release TrainFit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper 8.10.2..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        env:
          # 一键记录用的大模型接口：在仓库 Settings → Secrets and variables → Actions 里配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Read app version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "release-apk/TrainFit-v${VERSION}.apk"
          cp "$APK_PATH" release-apk/TrainFit-Latest.apk
          ls -lh release-apk/

      - name: Upload APK Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TrainFit-v${{ env.VERSION }}-APK
          path: release-apk/TrainFit-v${{ env.VERSION }}.apk
          retention-days: 30

      - name: Commit and Push APK directly to repo
        run: |
          mkdir -p downloads
          cp "release-apk/TrainFit-v${VERSION}.apk" "downloads/TrainFit-v${VERSION}.apk"
          cp "release-apk/TrainFit-v${VERSION}.apk" downloads/TrainFit-Latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "downloads/TrainFit-v${VERSION}.apk" downloads/TrainFit-Latest.apk
          git commit -m "chore(release): upload pre-built TrainFit-v${VERSION}.apk binary [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ env.VERSION }}
          name: "TrainFit v${{ env.VERSION }} 精简界面版 (Android APK)"
          body: |
            ### ✨ 练食AI (TrainFit) v1.7：更简单，说完不用等

            - **只剩两页**：「今天」和「趋势」，设置在右上角。去掉了计划卡片、训练清单、算片器、礼花、新手教程和各种确认弹窗。
            - **底部中间一个大按钮**：按住说话，点一下打字。
            - **说完不用等**：面板马上关掉，列表里显示「正在整理…」，整理好自动变成记录；失败可以重试、改字或删除。
            - **今天页**：大数字显示还能吃多少 kcal，下面写着预算怎么算的；蛋白质进度；当天饮食和训练按时间排，点一下就能改或删（可撤销）；左右滑动切换日期。
            - **趋势页**：每天热量缺口柱状图（点柱子跳到那天）、平均缺口、折合脂肪；每个动作最近成绩和下次该加重量还是加次数。
            - **深色 / 浅色 / 跟随系统**：修复「跟随系统」在 App 里永远是深色的问题，状态栏和导航栏一起变色；浅色模式提高了文字对比度。
            - **修复**：加片建议之前把最早一次训练当成最近一次；AI 连不上时无关的话会被记成「杠铃卧推」；页面顶部和输入框可能被状态栏、键盘挡住。
            - 去掉 Google 字体，国内打开更快。原来的数据全部保留，覆盖安装即可。

            **📥 下载下方 Assets 中的 `TrainFit-v${{ env.VERSION }}.apk` 或 `TrainFit-Latest.apk` 安装即可。**
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apk/TrainFit-v${{ env.VERSION }}.apk
            release-apk/TrainFit-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
