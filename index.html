<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>练食AI</title>
  <meta name="theme-color" content="#0b0b0d">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 尽早应用主题，避免闪一下
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('trainfit_theme') || 'system'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        // 安卓 App 里 prefers-color-scheme 不准，问原生系统是不是深色
        try {
          if (window.TrainFitNative && window.TrainFitNative.isSystemDark) t = window.TrainFitNative.isSystemDark() ? 'dark' : 'light';
          else t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) { t = 'dark'; }
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="app">

    <!-- 顶栏：日期 + 设置 -->
    <header class="topbar">
      <div class="date-switch" id="date-switch">
        <button class="icon-btn" id="date-prev" type="button" aria-label="前一天">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="date-label" id="date-label" type="button" aria-label="回到今天">今天</button>
        <button class="icon-btn" id="date-next" type="button" aria-label="后一天">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <h1 class="view-title hidden" id="view-title"></h1>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2" fill="var(--bg)"/><circle cx="15" cy="17" r="2.2" fill="var(--bg)"/></svg>
      </button>
    </header>

    <main class="views">

      <!-- ============ 今天 ============ -->
      <section class="view active" id="view-today">
        <div class="hero" id="hero">
          <div class="hero-label" id="hero-label">今天还能吃</div>
          <div class="hero-num"><span id="hero-num">0</span><small>kcal</small></div>
          <div class="meter" aria-hidden="true"><div class="meter-fill" id="hero-meter"></div></div>
          <div class="hero-foot" id="hero-foot"></div>
          <div class="hero-stats">
            <div class="hero-stat"><span>已吃</span><b id="st-intake">0</b></div>
            <div class="hero-stat"><span>训练消耗</span><b id="st-burn">0</b></div>
            <div class="hero-stat"><span>蛋白质</span><b id="st-protein">0 / 0g</b></div>
          </div>
        </div>

        <button class="setup-hint hidden" id="setup-hint" type="button">
          <span>先填一下身高体重，热量预算才准</span>
          <span aria-hidden="true">›</span>
        </button>

        <div class="list-head" id="list-head">记录</div>
        <div class="timeline" id="timeline"></div>
      </section>

      <!-- ============ 趋势 ============ -->
      <section class="view" id="view-trend">
        <div class="seg" id="trend-range" role="tablist">
          <button class="seg-btn active" data-range="7" type="button" role="tab">近 7 天</button>
          <button class="seg-btn" data-range="30" type="button" role="tab">近 30 天</button>
        </div>

        <div class="stat-row">
          <div class="stat-card"><span>平均每天缺口</span><b id="tr-avg">0</b><small>kcal</small></div>
          <div class="stat-card"><span>折合脂肪</span><b id="tr-fat">0</b><small>kg</small></div>
          <div class="stat-card"><span>记录天数</span><b id="tr-days">0</b><small>天</small></div>
        </div>

        <div class="card chart-card">
          <div class="card-head">
            <span>每天热量缺口</span>
            <span class="legend">
              <span><i class="sw sw-pos"></i>缺口</span>
              <span><i class="sw sw-neg"></i>超出</span>
              <span><i class="sw sw-target"></i>目标</span>
            </span>
          </div>
          <div class="chart" id="trend-chart"></div>
          <div class="chart-note">点柱子查看那天的记录</div>
        </div>

        <div class="list-head">动作进步</div>
        <div class="progress-list" id="progress-list"></div>
      </section>

      <!-- ============ 设置 ============ -->
      <section class="view" id="view-settings">
        <div class="card form-card">
          <div class="card-title">身体数据</div>
          <div class="field">
            <span class="field-label">性别</span>
            <div class="seg seg-sm" id="set-gender">
              <button class="seg-btn" data-value="male" type="button">男</button>
              <button class="seg-btn" data-value="female" type="button">女</button>
            </div>
          </div>
          <div class="field-grid">
            <label class="field"><span class="field-label">身高 cm</span><input class="input" id="set-height" type="number" inputmode="decimal"></label>
            <label class="field"><span class="field-label">体重 kg</span><input class="input" id="set-weight" type="number" inputmode="decimal" step="0.1"></label>
            <label class="field"><span class="field-label">年龄</span><input class="input" id="set-age" type="number" inputmode="numeric"></label>
          </div>
          <div class="field-note" id="set-tdee-note"></div>
        </div>

        <div class="card form-card">
          <div class="card-title">目标</div>
          <div class="seg seg-sm" id="set-goal">
            <button class="seg-btn" data-value="fat_loss" type="button">减脂</button>
            <button class="seg-btn" data-value="maintain" type="button">维持</button>
            <button class="seg-btn" data-value="muscle_gain" type="button">增肌</button>
          </div>
          <div class="field-grid field-grid-2">
            <label class="field"><span class="field-label">每天热量缺口 kcal</span><input class="input" id="set-deficit" type="number" inputmode="numeric"></label>
            <label class="field"><span class="field-label">每天蛋白质 g</span><input class="input" id="set-protein" type="number" inputmode="numeric"></label>
          </div>
          <div class="field-note">增肌时缺口是负数，比如 -250 表示每天多吃 250 kcal。改完自动保存。</div>
        </div>

        <div class="card form-card">
          <div class="card-title">外观</div>
          <div class="seg seg-sm" id="set-theme">
            <button class="seg-btn" data-value="system" type="button">跟随系统</button>
            <button class="seg-btn" data-value="dark" type="button">深色</button>
            <button class="seg-btn" data-value="light" type="button">浅色</button>
          </div>
          <div class="field-note" id="set-theme-note"></div>
        </div>

        <div class="card form-card">
          <div class="card-title">AI 接口</div>
          <p class="field-note" id="ql-cfg-hint"></p>
          <p class="field-note" id="set-speech-note"></p>
          <label class="field"><span class="field-label">接口地址 (Base URL)</span><input id="ql-cfg-base" class="input" type="url" autocomplete="off" spellcheck="false"></label>
          <label class="field"><span class="field-label">模型</span><input id="ql-cfg-model" class="input" type="text" autocomplete="off" spellcheck="false"></label>
          <label class="field"><span class="field-label">API Key</span><input id="ql-cfg-key" class="input" type="password" autocomplete="off" spellcheck="false"></label>
          <div class="btn-row">
            <button type="button" class="btn" id="ql-cfg-test">测试连接</button>
            <button type="button" class="btn" id="ql-cfg-save">保存</button>
          </div>
        </div>

        <div class="card form-card">
          <div class="card-title">数据</div>
          <div class="field-note" id="set-data-note"></div>
          <button type="button" class="btn btn-danger" id="set-clear">清空所有记录</button>
        </div>

        <div class="about">练食AI · 数据只存在这台手机上</div>
      </section>
    </main>

    <!-- 底部：今天 · 按住说话 · 趋势 -->
    <nav class="dock" id="dock">
      <button class="dock-tab active" data-view="today" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>今天</span>
      </button>
      <div class="mic-wrap">
        <button class="mic-btn" id="ql-fab" type="button" aria-label="按住说话，点一下打字">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <span class="mic-hint">按住说 · 点一下打字</span>
      </div>
      <button class="dock-tab" data-view="trend" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg>
        <span>趋势</span>
      </button>
    </nav>
  </div>

  <!-- 一键记录面板 -->
  <div class="sheet-overlay hidden" id="ql-overlay" data-state="idle">
    <div class="sheet" role="dialog" aria-label="一键记录">
      <div class="ql-visual" aria-hidden="true">
        <div class="ql-orb">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
      </div>
      <div class="ql-status-row">
        <span class="ql-dot"></span>
        <span id="ql-status">正在听…</span>
      </div>
      <textarea id="ql-text" class="ql-text" rows="4" placeholder="例：卧推80公斤4组8个，跑步20分钟，中午吃了黄焖鸡米饭" enterkeyhint="done"></textarea>
      <div class="btn-row">
        <button type="button" class="btn" id="ql-cancel">取消</button>
        <button type="button" class="btn btn-voice hidden" id="ql-voice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
          <span>语音</span>
        </button>
        <button type="button" class="btn btn-primary btn-wide" id="ql-primary">记下来</button>
      </div>
    </div>
  </div>

  <!-- 修改一条记录 -->
  <div class="sheet-overlay hidden" id="edit-overlay">
    <form class="sheet" id="edit-form" autocomplete="off">
      <div class="sheet-title" id="edit-title">修改</div>
      <div class="edit-fields" id="edit-fields"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-danger" id="edit-delete">删除</button>
        <button type="button" class="btn" id="edit-cancel">取消</button>
        <button type="submit" class="btn btn-primary btn-wide">保存</button>
      </div>
    </form>
  </div>

  <!-- 保存结果 + 撤销 -->
  <div class="snackbar hidden" id="ql-snackbar" role="status">
    <div class="snack-head">
      <b id="ql-snack-title">已记下</b>
      <button type="button" id="ql-undo">撤销</button>
    </div>
    <div id="ql-snack-list"></div>
  </div>

  <div class="toast hidden" id="app-toast" role="status"></div>

  <script src="js/nutrition.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quick_log.js"></script>
</body>
</html>
